<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Amigos Peludos</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f0f8ff; color: #333333; margin: 0; padding: 20px;">

    <!-- Menú de Navegación -->
    <nav style="background-color: #333333; padding: 15px; text-align: center; border-radius: 8px;">
        <a href="index.html" style="color: #ffffff; text-decoration: none; margin: 0 15px;">Inicio</a>
        <a href="about.html" style="color: #ffffff; text-decoration: none; margin: 0 15px;">Sobre Nosotros</a>
        <a href="contact.html" style="color: #ffffff; text-decoration: none; margin: 0 15px; font-weight: bold;">Contacto</a>
    </nav>

    <!-- Contenido Principal -->
    <main style="max-width: 800px; margin: 30px auto; background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <h1 style="color: #2c3e50; text-align: center;">Ponte en Contacto</h1>
        <p style="font-size: 16px; line-height: 1.6; text-align: center;">
            ¿Estás listo para adoptar o quieres ayudarnos como voluntario? ¡Escríbenos hoy mismo!
        </p>
        
        <!-- Formulario básico -->
        <form style="display: flex; flex-direction: column; max-width: 400px; margin: 0 auto; gap: 15px;">
            <label style="font-weight: bold;">Nombre:</label>
            <input type="text" placeholder="Tu nombre" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            
            <label style="font-weight: bold;">Correo Electrónico:</label>
            <input type="email" placeholder="tu@correo.com" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            
            <label style="font-weight: bold;">Mensaje:</label>
            <textarea placeholder="¿En qué mascota estás interesado?" rows="4" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: none;"></textarea>
            
            <button type="button" style="background-color: #27ae60; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer;">Enviar Mensaje</button>
        </form>
    </main>

</body>
</html>
